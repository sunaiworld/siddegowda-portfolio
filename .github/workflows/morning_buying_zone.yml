name: Morning Buying Zone Update

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULING ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────
# TARGET TIME: 10:00 AM IST (Asia/Kolkata), Monday through Friday.
#
# TIMEZONE CONVERSION:
#   GitHub Actions schedule cron is strictly evaluated in UTC.
#   IST = UTC + 5:30 (India Standard Time has no Daylight Saving Time).
#   10:00 AM IST - 05:30 = 04:30 UTC.
#   Cron expression: '30 4 * * 1-5' (04:30 UTC = 10:00 AM IST).
#
# IDEMPOTENCY:
#   morning_buying_zone.py tracks today's date in IST (YYYY-MM-DD) in the
#   Google Sheet 'Bot State' tab (cell B1).
#   Ensures exactly ONE Telegram update and sheet write per trading day.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST, Monday–Friday
    - cron: '30 4 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already sent today (bypasses idempotency)'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Log Trigger Timing
      run: |
        echo "========================================"
        echo "  MORNING BUYING ZONE — TIMING AUDIT"
        echo "========================================"
        echo "Trigger event  : ${{ github.event_name }}"
        echo "Workflow run # : ${{ github.run_number }}"
        echo "Runner UTC     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Runner IST     : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
        echo ""
        echo "Expected trigger: 04:30 UTC = 10:00 AM IST"
        echo "Actual UTC time : $(date -u '+%H:%M:%S UTC')"
        echo "Actual IST time : $(TZ='Asia/Kolkata' date '+%H:%M:%S IST')"
        python3 -c "
        from datetime import datetime, timezone, timedelta
        now_utc = datetime.now(timezone.utc)
        target_today_utc = now_utc.replace(hour=4, minute=30, second=0, microsecond=0)
        diff_sec = (now_utc - target_today_utc).total_seconds()
        diff_min = round(diff_sec / 60, 1)
        print(f'Timing Offset   : {diff_min:+0.1f} minutes from scheduled 04:30 UTC (10:00 AM IST)')
        " || true
        echo "========================================"

    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Send Morning Buying Zone Update
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          python scripts/morning_buying_zone.py --force
        else
          python scripts/morning_buying_zone.py
        fi

    - name: Log Completion Timing
      if: always()
      run: |
        echo "========================================"
        echo "Completed UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Completed IST : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
        echo "========================================"
