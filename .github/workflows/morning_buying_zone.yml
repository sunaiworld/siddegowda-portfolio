name: Morning Buying Zone Update

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULING ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────
# TARGET TIME: 10:00 AM IST (Asia/Kolkata), Monday through Friday.
#
# TIMEZONE CONVERSION:
#   GitHub Actions schedule cron is strictly evaluated in UTC.
#   IST = UTC + 5:30 (India Standard Time has no Daylight Saving Time).
#   10:00 AM IST = 04:30 UTC.
#   Off-peak minutes (:30, :15, :00) are used to avoid GitHub Actions queue bursts.
#
# SCHEDULE:
#   PRIMARY  : 04:30 UTC = 10:00 AM IST
#   BACKUP-1 : 05:15 UTC = 10:45 AM IST  (safety net for GH Actions scheduler delays)
#   BACKUP-2 : 06:00 UTC = 11:30 AM IST  (last resort; still before 13:00 IST cutoff)
#
# NOTE: All three triggers are comfortably before the 13:00 IST cutoff in the Python
# script. The old 06:45 UTC (12:15 PM IST) backup was structurally broken — it triggered
# AFTER the 12:00 PM IST cutoff that was hardcoded in morning_buying_zone.py, so it
# was always silently aborted. That bug is now fixed (cutoff moved to 13:00 IST).
#
# IDEMPOTENCY:
#   morning_buying_zone.py tracks today's date in IST (YYYY-MM-DD) in the
#   Google Sheet 'Bot State' tab (cell B1).
#   Ensures exactly ONE Telegram update and sheet write per trading day.
#   Duplicate triggers (backup crons) safely skip if already delivered today.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST  ← PRIMARY target trigger
    - cron: '30 4 * * 1-5'
    # 05:15 UTC = 10:45 AM IST  ← BACKUP-1: covers GH Actions scheduler delays up to 45 min
    - cron: '15 5 * * 1-5'
    # 06:00 UTC = 11:30 AM IST  ← BACKUP-2: last resort (still 90 min before 13:00 IST cutoff)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already sent today (bypasses idempotency)'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [morning_update]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Log Trigger Timing
      run: |
        echo "========================================================"
        echo "  MORNING BUYING ZONE — TIMING AUDIT"
        echo "========================================================"
        echo "Trigger event  : ${{ github.event_name }}"
        echo "Workflow run # : ${{ github.run_number }}"
        echo "Runner UTC     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Runner IST     : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
        echo ""
        echo "Scheduled triggers:"
        echo "  PRIMARY  : 04:30 UTC = 10:00 AM IST"
        echo "  BACKUP-1 : 05:15 UTC = 10:45 AM IST"
        echo "  BACKUP-2 : 06:00 UTC = 11:30 AM IST"
        echo "  Cutoff   : 13:00 IST  (07:30 UTC)"
        echo ""
        echo "Actual UTC time : $(date -u '+%H:%M:%S UTC')"
        echo "Actual IST time : $(TZ='Asia/Kolkata' date '+%H:%M:%S IST')"
        python3 -c "
        from datetime import datetime, timezone, timedelta
        IST = timezone(timedelta(hours=5, minutes=30))
        now_utc = datetime.now(timezone.utc)
        now_ist = now_utc.astimezone(IST)
        target_utc = now_utc.replace(hour=4, minute=30, second=0, microsecond=0)
        diff_min = round((now_utc - target_utc).total_seconds() / 60, 1)
        print(f'Timing Offset   : {diff_min:+0.1f} min from primary trigger 04:30 UTC (10:00 AM IST)')
        cutoff_ist = now_ist.replace(hour=13, minute=0, second=0, microsecond=0)
        remaining = round((cutoff_ist - now_ist).total_seconds() / 60, 0)
        print(f'Window remaining: {remaining:.0f} min until 13:00 IST cutoff')
        " || true
        echo "========================================================"

    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Send Morning Buying Zone Update
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          python scripts/morning_buying_zone.py --force
        else
          python scripts/morning_buying_zone.py
        fi

    - name: Log Completion Timing
      if: always()
      run: |
        echo "========================================================"
        echo "Completed UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Completed IST : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
        echo "========================================================"
