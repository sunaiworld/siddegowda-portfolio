name: Morning Buying Zone Update

on:
  schedule:
    # Staggered triggers from 09:00 AM IST to 10:30 AM IST (03:30–05:00 UTC) Monday-Friday.
    # IST = UTC + 5:30  →  10:00 AM IST = 04:30 UTC (target)
    # Window is 90 minutes wide to absorb GitHub Actions runner queue delays (often 30–60 min).
    # The script is idempotent: Bot State sheet ensures at most ONE Telegram alert per day.
    - cron: '30 3 * * 1-5'   # 03:30 UTC = 09:00 AM IST  (earliest trigger)
    - cron: '0 4 * * 1-5'    # 04:00 UTC = 09:30 AM IST
    - cron: '30 4 * * 1-5'   # 04:30 UTC = 10:00 AM IST  ← target
    - cron: '0 5 * * 1-5'    # 05:00 UTC = 10:30 AM IST  (latest trigger)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run and send Telegram alert even if already sent today'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Send Morning Buying Zone Update
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          python scripts/morning_buying_zone.py --force
        else
          python scripts/morning_buying_zone.py
        fi
