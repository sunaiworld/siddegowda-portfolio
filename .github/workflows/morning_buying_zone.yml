name: Morning Buying Zone Update

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULING ARCHITECTURE
# ─────────────────────────────────────────────────────────────────────────────
# PRIMARY TRIGGER: External scheduler (cron-job.org or equivalent)
#   → Calls GitHub workflow_dispatch API at exactly 04:30 UTC (10:00 AM IST)
#   → This fires OUTSIDE GitHub's queue system — not affected by GitHub delays
#   → Setup: see docs/SCHEDULING.md for exact cron-job.org configuration
#
# BACKUP TRIGGER: GitHub schedule cron '30 4 * * 1-5'
#   → Fires if the external scheduler is unavailable (PAT expired, cron-job down)
#   → Single entry only — multiple stagger entries caused repeated afternoon runs
#   → If workflow_dispatch already ran today, Bot State idempotency exits silently
#
# TIMEZONE NOTE: GitHub Actions cron is always UTC.
#   10:00 AM IST = 04:30 UTC  (IST = UTC + 5:30)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already sent today (bypasses idempotency)'
        required: false
        default: false
        type: boolean
  schedule:
    # BACKUP ONLY — primary scheduling is via external workflow_dispatch trigger.
    # Single cron: 04:30 UTC = 10:00 AM IST, Monday–Friday.
    # If the external scheduler triggered today, Bot State B1 will block this run.
    - cron: '30 4 * * 1-5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Log Trigger Timing
      run: |
        echo "========================================"
        echo "  MORNING BUYING ZONE — TIMING AUDIT"
        echo "========================================"
        echo "Trigger event  : ${{ github.event_name }}"
        echo "Workflow run # : ${{ github.run_number }}"
        echo "Runner UTC     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Runner IST     : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
        echo ""
        echo "Expected trigger: 04:30 UTC = 10:00 AM IST"
        echo "Actual UTC time : $(date -u '+%H:%M:%S UTC')"
        echo "Actual IST time : $(TZ='Asia/Kolkata' date '+%H:%M:%S IST')"
        echo "========================================"

    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Send Morning Buying Zone Update
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          python scripts/morning_buying_zone.py --force
        else
          python scripts/morning_buying_zone.py
        fi

    - name: Log Completion Timing
      if: always()
      run: |
        echo "========================================"
        echo "Completed UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Completed IST : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
        echo "========================================"
