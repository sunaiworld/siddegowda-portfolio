name: News Engine Test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/test_news_engine.py"
      - "src/news_engine/**"

jobs:
  test-news-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Engine test and capture output
        run: |
          python scripts/test_news_engine.py 2>&1 | tee news_engine_test_output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-engine-test-log
          path: news_engine_test_output.log
