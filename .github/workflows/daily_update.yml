name: Portfolio Daily Update

on:
  schedule:
    # 6:00 PM IST = 12:30 UTC Mon-Fri
    - cron: "30 12 * * 1-5"

  # Manual trigger from GitHub UI
  workflow_dispatch:

  # Webhook trigger from Google Apps Script
  repository_dispatch:
    types: [sheet_updated]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Show trigger source
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Sheet: ${{ github.event.client_payload.source }}"
            echo "Row: ${{ github.event.client_payload.row }}"
            echo "Time: ${{ github.event.client_payload.triggered }}"
          fi

      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio update
        env:
          SHEET_ID:                ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TRIGGER_SOURCE:          ${{ github.event_name }}
        run: python src/main.py
