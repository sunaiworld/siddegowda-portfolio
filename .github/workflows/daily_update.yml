name: Portfolio Daily Update

# SCHEDULING ARCHITECTURE:
# Target: Evening Portfolio Update (after NSE market close at 15:30 IST / 10:00 UTC).
#
# TIMEZONE & TIMING:
#   Market close: 15:30 IST (10:00 UTC).
#   Scheduled cron: 10:45 UTC = 16:15 IST (4:15 PM IST), Monday through Friday.
#   Why 10:45 UTC instead of 12:15 UTC?
#     The previous 12:15 UTC (5:45 PM IST) cron landed directly in GitHub Actions' peak
#     global congestion window (12:00-14:00 UTC), causing ~6-hour queue delays that
#     consistently pushed execution to 18:18-18:54 UTC (23:48-00:24 IST / midnight).
#     Scheduling at 10:45 UTC (45 minutes after market close) avoids the 12:00 UTC traffic spike
#     and absorbs typical GitHub queue delays (30-90 min), landing the run squarely in the
#     intended evening window (17:00-18:30 IST / 5:00-6:30 PM IST), without duplicate runs.
#
# IDEMPOTENCY:
#   The portfolio update is safe to re-run (it rewrites Google Sheets data).
#   repository_dispatch [sheet_updated] provides near-real-time triggering.
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [sheet_updated]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: portfolio-daily-update
  cancel-in-progress: false

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Log trigger timing
        run: |
          echo "========================================================"
          echo "  PORTFOLIO DAILY UPDATE — TIMING AUDIT"
          echo "========================================================"
          echo "Trigger event  : ${{ github.event_name }}"
          echo "Workflow run # : ${{ github.run_number }}"
          echo "Runner UTC     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner IST     : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "Scheduled cron : 10:45 UTC = 04:15 PM IST (target)"
          echo "Actual UTC time: $(date -u '+%H:%M:%S UTC')"
          echo "Actual IST time: $(TZ='Asia/Kolkata' date '+%H:%M:%S IST')"
          echo "========================================================"

      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio update
        env:
          SHEET_ID:                ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_SOURCE:          ${{ github.event_name }}
        run: python scripts/run_daily_update.py

      - name: Commit and push monthly snapshot
        run: |
          if [ -d "data/snapshots" ] && [ -n "$(git status --porcelain data/snapshots)" ]; then
            echo "New monthly snapshot files detected. Committing to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/snapshots/
            SNAPSHOT_MONTH=$(ls -1 data/snapshots | grep -E '^[0-9]{4}-[0-9]{2}$' | sort | tail -n 1)
            if [ -z "$SNAPSHOT_MONTH" ]; then
              SNAPSHOT_MONTH=$(date +'%Y-%m')
            fi
            git commit -m "data: add monthly portfolio snapshot ${SNAPSHOT_MONTH} [skip ci]"
            git push origin main
            echo "Snapshot commit pushed successfully."
          else
            echo "No new monthly snapshot files to commit."
          fi

      - name: Log completion timing
        if: always()
        run: |
          echo "========================================================"
          echo "Completed UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Completed IST : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "========================================================"
