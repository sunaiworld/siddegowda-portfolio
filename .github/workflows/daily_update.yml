name: Portfolio Daily Update

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [sheet_updated]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Show trigger source
        run: |
          echo "Triggered by: ${{ github.event_name }}"

      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio update
        env:
          SHEET_ID:                ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TELEGRAM_TOKEN:          ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_SOURCE:          ${{ github.event_name }}
        run: python scripts/run_daily_update.py

      - name: Commit and push monthly snapshot
        run: |
          if [ -d "data/snapshots" ] && [ -n "$(git status --porcelain data/snapshots)" ]; then
            echo "New monthly snapshot files detected. Committing to repository..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/snapshots/
            SNAPSHOT_MONTH=$(ls -1 data/snapshots | grep -E '^[0-9]{4}-[0-9]{2}$' | sort | tail -n 1)
            if [ -z "$SNAPSHOT_MONTH" ]; then
              SNAPSHOT_MONTH=$(date +'%Y-%m')
            fi
            git commit -m "data: add monthly portfolio snapshot ${SNAPSHOT_MONTH} [skip ci]"
            git push origin main
            echo "Snapshot commit pushed successfully."
          else
            echo "No new monthly snapshot files to commit."
          fi
