name: Telegram Bot Poller

# Trigger manually via workflow_dispatch only.
# NOTE: Scheduled 5-minute cron ('*/5 * * * *') is removed because high-frequency
# polling in GitHub Actions overwhelms runner quotas and causes GitHub's scheduler
# to delay all scheduled repository workflows (including Morning Buying Zone) by 4-5 hours.
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python telegram_bot.py
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
